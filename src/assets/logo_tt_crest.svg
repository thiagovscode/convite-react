<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 520" fill="none">
<defs>
  <!-- Gradiente dourado principal — metálico champagne -->
  <linearGradient id="gMain" x1="15%" y1="5%" x2="85%" y2="95%">
    <stop offset="0%"   stop-color="#F5E28A"/>
    <stop offset="22%"  stop-color="#D4AF5A"/>
    <stop offset="48%"  stop-color="#C9A84C"/>
    <stop offset="72%"  stop-color="#B58835"/>
    <stop offset="100%" stop-color="#8C6A1E"/>
  </linearGradient>
  <!-- Gradiente horizontal para flores e folhas -->
  <linearGradient id="gFloral" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"   stop-color="#EAC96A"/>
    <stop offset="50%"  stop-color="#C9A84C"/>
    <stop offset="100%" stop-color="#B07A28"/>
  </linearGradient>
  <!-- Gradiente vertical para o monograma TT -->
  <linearGradient id="gTT" x1="0%" y1="0%" x2="10%" y2="100%">
    <stop offset="0%"   stop-color="#F0DA80"/>
    <stop offset="35%"  stop-color="#D4AF5A"/>
    <stop offset="65%"  stop-color="#C0982E"/>
    <stop offset="100%" stop-color="#9C7820"/>
  </linearGradient>
  <!-- Brilho sutil no centro do escudo -->
  <radialGradient id="gShieldGlow" cx="50%" cy="40%" r="50%">
    <stop offset="0%"   stop-color="rgba(255,245,210,0.18)"/>
    <stop offset="100%" stop-color="rgba(255,245,210,0)"/>
  </radialGradient>
</defs>

<!-- ═══════════════════════════════════════════════
     ESCUDO HERÁLDICO — Borda externa
═══════════════════════════════════════════════ -->
<path stroke="url(#gMain)" stroke-width="2.6" stroke-linejoin="round"
  d="
  M 250,62
  C 258,63 275,68 300,78
  L 368,78
  Q 392,78 392,108
  L 390,285
  Q 387,370 250,450
  Q 113,370 110,285
  L 108,108
  Q 108,78 132,78
  L 200,78
  C 225,68 242,63 250,62
  Z"/>

<!-- Entalhe decorativo no topo (losango/chevron) -->
<path fill="url(#gMain)"
  d="M 250,62 L 263,78 L 250,92 L 237,78 Z"/>
<!-- Face interna clara do entalhe (efeito 3D) -->
<path fill="rgba(255,248,220,0.28)"
  d="M 250,68 L 259,79 L 250,88 L 241,79 Z"/>

<!-- ═══════════════════════════════════════════════
     ESCUDO HERÁLDICO — Borda interna (offset)
═══════════════════════════════════════════════ -->
<path stroke="url(#gMain)" stroke-width="1.8" stroke-linejoin="round" opacity="0.92"
  d="
  M 250,80
  C 257,81 270,85 292,94
  L 354,94
  Q 373,94 373,120
  L 371,284
  Q 368,357 250,430
  Q 132,357 129,284
  L 127,120
  Q 127,94 146,94
  L 208,94
  C 230,85 243,81 250,80
  Z"/>

<!-- Brilho interno do escudo -->
<path fill="url(#gShieldGlow)"
  d="M 250,80 C 280,85 360,95 370,120 L 368,284 Q 365,355 250,428 Q 135,355 132,284 L 130,120 Q 140,95 250,80 Z"/>

<!-- Linhas verticais no terço inferior do escudo (detalhe heráldico) -->
<path stroke="url(#gMain)" stroke-width="1.2" stroke-linecap="round" opacity="0.45"
  d="M 234,380 L 250,428 M 266,380 L 250,428"/>
<path stroke="url(#gMain)" stroke-width="1" stroke-linecap="round" opacity="0.35"
  d="M 234,365 L 234,405 M 266,365 L 266,405"/>

<!-- ═══════════════════════════════════════════════
     MONOGRAMA TT — dois T sobrepostos
═══════════════════════════════════════════════ -->
<!-- T de trás (levemente deslocado para a esquerda, menor opacidade) -->
<text x="228" y="318"
  font-family="'Cinzel Decorative','Cinzel',Georgia,'Times New Roman',serif"
  font-size="122" font-weight="400" font-style="normal"
  fill="url(#gTT)" opacity="0.75"
  letter-spacing="-2">T</text>
<!-- T da frente (principal) -->
<text x="250" y="312"
  font-family="'Cinzel Decorative','Cinzel',Georgia,'Times New Roman',serif"
  font-size="122" font-weight="400" font-style="normal"
  fill="url(#gTT)"
  letter-spacing="-2">T</text>

